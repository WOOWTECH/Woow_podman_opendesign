# Installed as ~/.config/open-design/nginx-paseo.conf when WOOW_OD_PASEO=on; scripts/install.sh fills
# in the origin. Included in the server block of nginx.conf, behind the same Basic auth as the UI.
# The Paseo bridge listens on 127.0.0.1:7460 in the daemon's container, whose network namespace nginx
# shares. Its health endpoint stays private. These are the PaaS chart's routes and headers.
    # the setup page
    location = /paseo/setup {
        # Reads may come without an Origin; anything else must come from the Paseo origin.
        set $od_paseo_check "$request_method $http_origin";
        if ($od_paseo_check !~ "^(GET|HEAD) $|^[A-Z]+ @@PASEO_ORIGIN_RE@@$") {
            return 403;
        }
        # Login and pairing values travel in query strings; no request line may reach a log.
        access_log off;
        error_log /dev/null;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7460;
        # A proxy_set_header here replaces the whole list of the server block.
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Authorization     "";
        proxy_set_header X-Remote-User-Id  $remote_user;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # the setup page
