worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basics
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 512m;

    # Log to stdout/stderr so `podman logs` sees it. Include upstream + gzip
    # timings so we can diagnose slow paths.
    log_format perf '$remote_addr "$request" $status ${body_bytes_sent}B '
                    'rt=${request_time}s ut=${upstream_response_time}s '
                    'gz=${gzip_ratio}';
    access_log /dev/stdout perf;
    error_log  /dev/stderr warn;

    # Gzip — the main fix. Compresses ~9 MB of JS/CSS to ~2 MB.
    # sub_filter defaults to text/html only, which is exactly the scope the
    # export bridge needs — the injection anchors on <head>. Widening
    # sub_filter_types to JS would risk rewriting a bundle that happens to
    # contain the literal string.
    sub_filter_once off;
    sub_filter_last_modified on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/wasm
        application/font-woff
        application/font-woff2
        font/ttf
        font/otf
        image/svg+xml
        image/x-icon;

    # Upstream: OD daemon on loopback (moved off public 7456)
    upstream open_design {
        server 127.0.0.1:7457;
        keepalive 32;
    }

    server {
        listen 7456 default_server;
        listen [::]:7456 default_server;
        server_name _;

        # The browser-facing credential check. scripts/install.sh installs either
        # nginx-auth.basic.conf (default) or nginx-auth.off.conf as this file.
        # It has to live here: the OpenDesign daemon exempts loopback callers from
        # its own API token, and nginx is always a loopback caller.
        include /etc/nginx/woow-auth.conf;

        # Long-lived AI streams (chat, media generation) may run for minutes.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 30s;
        proxy_http_version 1.1;
        # Buffering ON by default — critical for gzip on static assets.
        # Without it nginx passes tiny chunks through and gzip stalls.
        # We turn buffering OFF explicitly only for streaming endpoints below.
        proxy_buffering on;

        # Preserve original host/scheme for OD's origin checks.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE support (Next.js HMR, chat streams, MCP)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Immutable cache for hashed Next.js chunks.
        # These filenames contain a content hash so they can be cached forever.
        location ^~ /_next/static/ {
            proxy_pass http://open_design;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # OD static assets under /static/ (older pattern)
        location ^~ /static/ {
            proxy_pass http://open_design;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Agent icons — 20+ small PNG/SVG requests per page load.
        # Rarely change; cache aggressively.
        location ^~ /agent-icons/ {
            proxy_pass http://open_design;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # Plugin assets — landing page hero PNGs are ~2MB each and re-fetched
        # every page load. Cache for a week (content-addressed by plugin id).
        location ~ ^/api/plugins/[^/]+/asset/ {
            proxy_pass http://open_design;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800" always;
        }

        # Liveness probe for the nginx container's own healthcheck and for
        # monitoring: no credentials, no body of interest.
        location = /api/health {
            auth_basic off;
            proxy_pass http://open_design;
            proxy_buffering off;
        }

        # Whole /api/ tree: no buffering, no gzip.
        # OD has many SSE / long-poll endpoints beyond the obvious ones —
        # /api/agents?stream=1 (chat), /api/memory/events, /api/integrations/vela/*,
        # MCP over SSE, etc. Enumerating them individually is a footgun; JSON
        # responses are usually <10 KB so gzip savings are negligible anyway.
        # Plugin asset PNGs are handled by the earlier regex location and keep
        # their 7-day cache header.
        location /api/ {
            proxy_pass http://open_design;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            # Some SSE clients timeout at 1min without keepalive frames.
            proxy_read_timeout 3600s;
        }

        # Served from a bind mount beside nginx.conf: this is the nginx
        # container, so the bridge lives next to the config rather than inside
        # the OpenDesign image. scripts/install.sh installs both from config/
        # into ~/.config/open-design/.
        location = /od-export-bridge.js {
            alias /etc/nginx/od-export-bridge.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        # Everything else — let OD decide caching.
        location / {
            proxy_pass http://open_design;

            # Required for sub_filter to see the response body at all; without
            # it the upstream may answer gzipped and the injection silently
            # does nothing.
            proxy_set_header Accept-Encoding "";

            # The ONE body rewrite. The UI's "export PDF" button POSTs to
            # /api/projects/<id>/export/pdf, which is the Electron/desktop
            # route. headless-entry.mjs passes desktopArtifactExporter: null,
            # so the daemon answers 501 and the button is dead. The bridge
            # rewrites that call to /export/pdf-image, which the headless
            # renderer does serve. k3s and the HA add-on both ship this; this
            # stack was missing it, which is the whole point of this change.
            sub_filter '<head>' '<head><script src="/od-export-bridge.js"></script>';
        }
    }

    # Map for websocket Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}
