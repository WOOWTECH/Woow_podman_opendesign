# Installed as ~/.config/open-design/nginx-paseo.conf when WOOW_OD_PASEO=off (the default). The Paseo
# card is in every OpenDesign build and opens /paseo/setup/; this answers it instead of the app shell.
location = /paseo/setup {
    default_type text/plain;
    return 503 "Paseo is off on this host. Set WOOW_OD_PASEO=on and an HTTPS OPENDESIGN_PASEO_ORIGIN in open-design.env, then run scripts/install.sh again.\n";
}
location = /paseo/setup/ {
    default_type text/plain;
    return 503 "Paseo is off on this host. Set WOOW_OD_PASEO=on and an HTTPS OPENDESIGN_PASEO_ORIGIN in open-design.env, then run scripts/install.sh again.\n";
}
