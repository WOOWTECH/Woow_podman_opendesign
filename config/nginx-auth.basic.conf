# Installed as ~/.config/open-design/nginx-auth.conf when WOOW_OD_AUTH=basic (the default).
# The browser shows its native sign-in dialog: user "open-design", password = the
# open-design-api-token secret. That is upstream's own Docker sign-in shape, so API clients can use
# the same credentials through this front.
auth_basic "OpenDesign";
auth_basic_user_file /etc/nginx/htpasswd;
