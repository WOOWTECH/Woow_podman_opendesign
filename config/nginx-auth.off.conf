# Installed as ~/.config/open-design/nginx-auth.conf when WOOW_OD_AUTH=off. Use this only when an
# authenticating proxy (Cloudflare Access, an NPM access list, ...) is the only way to reach the
# published port: the daemon exempts loopback callers, so without this front there is no credential
# check at all, and /api/models-config returns provider keys to anyone who can reach it.
auth_basic off;
