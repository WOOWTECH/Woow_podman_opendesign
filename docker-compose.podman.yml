# Woow OpenDesign for rootless podman, aligned with the Home Assistant add-on.
#
# Usage:
#   podman-compose -f docker-compose.podman.yml up -d
#
# What "aligned" changed here, and why each thing left:
#   * pi-agent-data volume + PI_* environment + PI_BIN — gone. The coding agent
#     is OpenCode, baked into the image. This stack no longer shares state with
#     the pi-web deployment, which is what let a pi-web change take OpenDesign
#     down with it.
#   * ~/.local/bin, ~/.claude, ~/.claude.json and the host /lib mounts — gone.
#     They existed so the daemon could execute the HOST's agent CLIs through
#     glibc shims. Standalone means the container carries its own agent; those
#     mounts were also the stack's largest read path into the host filesystem.
#   * mem_limit / NODE_OPTIONS defaults raised from 384m / 192MB. Those predate
#     the export pipeline: Chromium alone does not start in 384m, so every
#     PDF/PPTX/PNG export would OOM. The .env.example already documented 2g and
#     1536; the defaults here now agree with it instead of contradicting it.

name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-open-design-full}
    restart: unless-stopped
    network_mode: host
    # Rootless podman userns mapping: container UID 1001 (open-design) becomes
    # the invoking host UID, so the named volume is writable without any chown
    # in the entrypoint. The launcher relies on this — see podman-opendesign.
    userns_mode: keep-id:uid=1001,gid=1001
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-2g}
    pids_limit: 512
    cpus: '2.0'
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1536}
      # Loopback only. With network_mode: host any other bind would put an
      # unauthenticated daemon on the LAN; nginx on 7456 is the only client.
      OD_BIND_HOST: 127.0.0.1
      OD_PORT: ${OPEN_DESIGN_INTERNAL_PORT:-7457}
      OD_WEB_PORT: ${OPEN_DESIGN_INTERNAL_PORT:-7457}
      # Every browser-facing origin must be listed or OpenDesign's origin guard
      # returns 403 on every mutating route while the UI still renders.
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-http://127.0.0.1:7456}
      OD_API_TOKEN: ${OD_API_TOKEN:-}
      OD_DISABLE_API_AUTH: ${OPEN_DESIGN_DISABLE_API_AUTH:-}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
      # Optional BYOK keys. Blank is fine — they are settable from the UI.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # Holds projects, app.sqlite AND (new) $HOME for OpenCode's credentials.
      - open_design_data:/app/.od
    tmpfs:
      - /tmp
      # Still a tmpfs, but no longer holds anything that must survive: HOME is
      # /app/.od/home now. Rootless podman rejects Docker's uid/gid tmpfs
      # options, so mode=1777 is how uid 1001 gets to write here.
      - /home/open-design:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${OPEN_DESIGN_INTERNAL_PORT:-7457}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # nginx sidecar: gzip + immutable cache for hashed /_next/static chunks +
  # WebSocket/SSE passthrough. OD's Express serves ~9 MB of JS/CSS uncompressed
  # and forces re-validation of every chunk on each load without it.
  nginx:
    container_name: open-design-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 128
    cpus: '0.5'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # The export bridge nginx injects into <head>. It has to be
      # mounted beside the config because this is the stock nginx
      # image, not the OpenDesign one.
      - ./od-export-bridge.js:/etc/nginx/od-export-bridge.js:ro
    depends_on:
      - open-design
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${OPEN_DESIGN_PORT:-7456}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  open_design_data:
