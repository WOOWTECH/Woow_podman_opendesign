# .github/workflows/repo-checks.yml: repo-specific static checks. quadlet-ci.yml is vendored from
# Woow_quadlet_migration_plan/lib and must not be edited; checks that belong to this repo live here.
name: repo-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Credentials, compose removal (D1), READMEs, VERSION parity, auth boundary
        run: tests/lint-repo.sh
      - name: Credential boundary of nginx
        run: tests/nginx-auth.sh

      - name: Migration model tests (podman and systemctl are shims; no container is created)
        run: tests/migrate-model.sh

      - name: nginx -t for every auth and Paseo variant
        run: |
          set -eux
          # The units mount these four files plus the htpasswd secret; check the config parses with
          # the same nginx version the unit pins. Paseo on is rendered as install.sh does.
          image=$(sed -n 's/^Image=//p' quadlet/open-design-nginx.container)
          printf 'open-design:$apr1$dummysal$0123456789abcdefghijkl.\n' > /tmp/htpasswd
          cp config/nginx-paseo.off.conf /tmp/paseo-off.conf
          sed 's|@@PASEO_ORIGIN_RE@@|https://od\\.example\\.com|g' config/nginx-paseo.on.conf > /tmp/paseo-on.conf
          for variant in basic off; do
            for paseo in on off; do
              docker run --rm \
                -v "$PWD/config/nginx.conf:/etc/nginx/nginx.conf:ro" \
                -v "$PWD/config/nginx-auth.$variant.conf:/etc/nginx/woow-auth.conf:ro" \
                -v "/tmp/paseo-$paseo.conf:/etc/nginx/woow-paseo.conf:ro" \
                -v "$PWD/config/od-export-bridge.js:/etc/nginx/od-export-bridge.js:ro" \
                -v /tmp/htpasswd:/etc/nginx/htpasswd:ro \
                "$image" nginx -t
            done
          done

      - name: hadolint on Dockerfile.full
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.full
          failure-threshold: error

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The core contract is the last RUN of Dockerfile.full: this fails on a core that lacks an
      # agent CLI or has another version of one.
      - name: Build the image from the pinned core
        run: docker build --build-arg BUILD_VERSION="$(cat VERSION)" -f Dockerfile.full -t woow-open-design:ci .
